<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>料金報告書 作成（CSV → PDF）</title>
<!-- CSV パーサ / PDF 生成（すべてブラウザ内完結・データは外部送信しません） -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  /* ============ 画面UI（操作部・印刷では非表示） ============ */
  :root{
    --bg:#f4f6f9; --ink:#1f2733; --muted:#6b7785; --line:#d3dae3;
    --navy:#2a3a55; --ok:#1d8a4c; --warn:#c0392b; --warnbg:#fdecea;
    --accent:#2e6fdb;
  }
  *{box-sizing:border-box}
  body{font-family:'Yu Gothic UI','Meiryo',system-ui,sans-serif;color:var(--ink);
       background:var(--bg);margin:0;padding:24px;font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 14px;font-size:13px}
  .privacy{display:inline-block;background:#e7f6ee;color:#1d8a4c;border:1px solid #bfe6cf;
           border-radius:20px;padding:2px 12px;font-size:12px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;
        margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--navy);
        color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
  #drop{border:2px dashed #b6c1cf;border-radius:12px;padding:38px;text-align:center;
        color:var(--muted);background:#fafbfd;cursor:pointer;transition:.15s}
  #drop.hot{border-color:var(--accent);background:#eef4ff;color:var(--accent)}
  #drop b{color:var(--ink)}
  .files{margin-top:12px;font-size:13px}
  .files .f{display:inline-flex;align-items:center;gap:6px;background:#eef1f5;
            border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin:3px}
  .files .f button{border:none;background:none;color:var(--warn);cursor:pointer;font-size:14px;padding:0}
  .opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;align-items:center}
  .opts label{display:flex;align-items:center;gap:6px;color:var(--ink)}
  select,input[type=date]{padding:6px 9px;border:1px solid var(--line);border-radius:7px;
        font-size:13px;background:#fff;font-family:inherit}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fld{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .minibtn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 9px;
        font-size:11px;cursor:pointer;color:var(--ink)}
  .statuschips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef1f5;border:1px solid var(--line);
        border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer;user-select:none}
  .chip:has(input:not(:checked)){opacity:.5;text-decoration:line-through}
  .chip .cnt{background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 7px;
        font-size:11px;color:var(--muted)}
  .rowwrap{max-height:320px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:8px}
  .rowtbl{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
  .rowtbl th,.rowtbl td{border:1px solid var(--line);padding:4px 8px;text-align:left;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowtbl thead th{background:#f1f4f8;position:sticky;top:0;z-index:1}
  .rowtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  .rowtbl td.c-chk,.rowtbl th.c-chk{text-align:center;overflow:visible}
  .rowtbl tr.off td{opacity:.4}
  .rowtbl input{cursor:pointer}
  .rowtbl col.w-chk{width:3%}
  .rowtbl col.w-id{width:7%}
  .rowtbl col.w-date{width:8%}
  .rowtbl col.w-agent{width:17%}
  .rowtbl col.w-guest{width:15%}
  .rowtbl col.w-pu{width:23%}
  .rowtbl col.w-do{width:19%}
  .rowtbl col.w-amt{width:8%}
  button.run{background:var(--accent);color:#fff;border:none;border-radius:8px;
        padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer}
  button.run:disabled{background:#9db4dd;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);border-radius:8px;
        padding:10px 16px;font-size:13px;cursor:pointer;color:var(--ink)}
  .err{background:var(--warnbg);color:var(--warn);border:1px solid #f3c6c0;border-radius:8px;
       padding:10px 14px;margin-bottom:14px;font-size:13px;white-space:pre-wrap}
  .hidden{display:none}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}

  /* ============ 報告書シート（report.css 踏襲・A4横） ============ */
  .sheets{background:#e7ebf0;padding:18px;border-radius:10px;max-width:1100px;margin:0 auto}
  .sheet{
    width:100%;             /* 画面では操作カードと同じ幅に揃える（印刷はA4で上書き） */
    min-height:190mm;
    margin:0 0 18px;
    padding:6mm 4mm;
    position:relative;
    background:#fff;
    color:#000;
    box-shadow:0 1px 6px rgba(0,0,0,.15);
    font-family:"Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  }
  .doc-title{text-align:center;font-size:20px;font-weight:700;letter-spacing:2px;margin:4px 0 18px}
  .issue-date{text-align:right;font-size:12px;margin-bottom:6px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
  .head-left{max-width:60%}
  .addressee{font-size:13px;margin-bottom:14px}
  .agent-name{font-size:16px;font-weight:700}
  .greeting p{margin:2px 0;font-size:12px}
  .head-right{text-align:right;font-size:12px;line-height:1.5;white-space:nowrap}
  .company-name{font-size:15px;font-weight:700;margin-bottom:6px}
  .total-box{display:flex;align-items:center;background:#efefef;border:1px solid #bbb;
        width:360px;height:40px;margin:6px 0 14px}
  .total-label{font-size:13px;font-weight:700;padding:0 14px;border-right:1px solid #bbb;
        height:100%;display:flex;align-items:center;background:#e2e2e2}
  .total-yen{font-size:18px;padding:0 8px 0 16px}
  .total-amount{font-size:22px;font-weight:700;flex:1;text-align:right;padding-right:16px}
  .detail-table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
  .detail-table th,.detail-table td{border:1px solid #cfcfcf;padding:6px 8px;vertical-align:middle;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail-table thead th{background:#e2e2e2;font-weight:700;text-align:center;white-space:nowrap}
  .detail-table tbody td{height:30px}
  .c-id{width:7%;text-align:center}
  .c-date{width:9%;text-align:center}
  .c-guest{width:18%}
  .c-pu{width:26%}
  .c-do{width:26%}
  .c-amount{width:14%;text-align:center;font-variant-numeric:tabular-nums}
  .detail-table td.c-amount{font-size:15px;font-weight:600}
  tr.zero td{background:#fdecea}
  tr.cancel td{background:#fdecea;text-decoration:line-through;color:#b03}
  .footer{text-align:center;font-style:italic;font-size:13px;margin-top:26px;color:#333}

  /* ============ 印刷（PDF）時 ============ */
  @page{size:A4 landscape;margin:8mm}
  @media print{
    body{background:#fff;padding:0}
    .noprint{display:none !important}
    .sheets{background:none;padding:0}
    .sheet{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none;
      page-break-after:always}
    .sheet:last-child{page-break-after:auto}
    html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap noprint">
  <h1>料金報告書 作成</h1>
  <p class="sub">Busking の運行一覧 CSV（daily-*.csv）をドロップ → 代理店ごとの「ご料金明細書」を表示 → 印刷で PDF 保存</p>
  <div class="privacy">🔒 ファイルはブラウザ内だけで処理され、外部に送信されません</div>

  <!-- STEP 1: drop -->
  <div class="card">
    <h2><span class="step">1</span> CSV を投入</h2>
    <div id="drop">
      <div style="font-size:30px">📄</div>
      <div><b>ここに CSV をドラッグ&ドロップ</b> またはクリックして選択</div>
      <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">
        Busking エクスポート（daily-YYYY-MM-DD*.csv／Shift_JIS）。複数まとめて可。</div>
    </div>
    <input type="file" id="fileInput" class="hidden" multiple accept=".csv,.txt">
    <div class="files" id="fileList"></div>
    <div class="opts">
      <label>文字コード:
        <select id="encoding">
          <option value="auto">自動判定</option>
          <option value="shift_jis">Shift_JIS (cp932)</option>
          <option value="utf-8">UTF-8</option>
        </select>
      </label>
    </div>
  </div>

  <!-- STEP 2: action -->
  <div class="card hidden" id="actionCard">
    <h2><span class="step">2</span> 確認して PDF 化</h2>
    <div class="opts" style="margin-top:0">
      <label>発行日:
        <input type="date" id="issueDate">
      </label>
    </div>
    <div id="agentFilter" style="margin-top:14px"></div>
    <div id="statusFilter" style="margin-top:14px"></div>
    <div id="rowFilter" style="margin-top:14px"></div>
    <div id="warn" class="err hidden" style="margin-top:14px"></div>
    <div class="toolbar" style="margin-top:16px">
      <button class="run" id="dlBtn">⬇ PDF をダウンロード</button>
      <button class="ghost" id="printBtn">🖨 印刷</button>
      <span class="hint" id="dlHint" style="font-size:12px;color:var(--muted)">
        代理店ごとに1ファイル、自動でダウンロードされます。</span>
    </div>
  </div>

  <footer>Busking CSV → 料金報告書（ブラウザ内処理）</footer>
</div>

<!-- 報告書プレビュー（=印刷対象） -->
<div class="sheets" id="sheets"></div>

<script>
"use strict";

/* ============ 状態 ============ */
let FILES = [];          // {file, rows:[[...]]}  rows[0] = ヘッダ
let statusChoice = {};   // 状況の値 -> PDFに含めるか（true/false）
let agentChoice = {};    // 代理店名 -> PDFに含めるか（true/false）
let rowChoice = {};      // 案件 uid -> PDFに含めるか（true/false）

/* ============ 会社情報（report.html より） ============ */
const COMPANY = {
  name: '株式会社Ｖリムジン',
  lines: ['〒104-0061', '東京都中央区銀座8-18-4　東銀座ビル6F', 'TEL：03-6281-5740', 'FAX：03-6281-5741'],
  footer: 'V-Limousine'
};

/* ============ 列名 → 報告書項目 ============ */
const COL = {
  id:     ['予約ID'],
  status: ['状況'],
  date:   ['運行日'],
  agent:  ['代理店'],          // 「代理店担当」「代理店ID」と区別するため完全一致
  guest:  ['団体名', 'お客様名'],
  time:   ['配車時刻'],
  pu:     ['配車場所'],
  dropoff:['到着地'],
  amount: ['請求金額', '売上金額']
};

/* ============ ファイル読み込み ============ */
const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');

// 発行日 既定 = 本日（ローカル）
(function initDate(){
  const d = new Date();
  const v = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  document.getElementById('issueDate').value = v;
})();

dropEl.addEventListener('click', () => fileInput.click());
['dragenter','dragover'].forEach(e => dropEl.addEventListener(e, ev => {
  ev.preventDefault(); dropEl.classList.add('hot');
}));
['dragleave','drop'].forEach(e => dropEl.addEventListener(e, ev => {
  ev.preventDefault(); if(e==='drop'||ev.target===dropEl) dropEl.classList.remove('hot');
}));
dropEl.addEventListener('drop', ev => {
  ev.preventDefault(); dropEl.classList.remove('hot');
  handleFiles(ev.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));
document.getElementById('encoding').addEventListener('change', reparseAll);
document.getElementById('issueDate').addEventListener('change', render);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('dlBtn').addEventListener('click', downloadPdfs);

function handleFiles(list){
  const files = Array.from(list);
  let pending = files.length;
  if(!pending) return;
  files.forEach(f => parseFile(f, () => { if(--pending===0) afterParse(); }));
}
function reparseAll(){
  if(!FILES.length) return;
  const files = FILES.map(r => r.file); FILES = [];
  let pending = files.length;
  files.forEach(f => parseFile(f, () => { if(--pending===0) afterParse(); }));
}

function decodeBuffer(buf, enc){
  if(enc === 'utf-8') return new TextDecoder('utf-8').decode(buf);
  if(enc === 'shift_jis') return new TextDecoder('shift_jis').decode(buf);
  // auto: strict utf-8 → 失敗時 shift_jis（Busking は cp932 既定）
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('shift_jis').decode(buf); }
}

function parseFile(file, done){
  const enc = document.getElementById('encoding').value;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const text = decodeBuffer(reader.result, enc);
      // ヘッダ重複（運行日/発車時刻 等が複数）があるため header:false（配列）で取り込み、位置で扱う
      const res = Papa.parse(text, {header:false, skipEmptyLines:'greedy'});
      const rows = res.data.filter(r => r.some(c => String(c).trim() !== ''));
      if(rows.length >= 2) FILES.push({file, rows});
      else showWarn('データ行がありません: ' + file.name);
    }catch(err){
      showWarn('読み込み失敗: ' + file.name + '\n' + err.message);
    }
    done();
  };
  reader.onerror = () => { showWarn('ファイル読込エラー: ' + file.name); done(); };
  reader.readAsArrayBuffer(file);
}

function afterParse(){
  renderFileChips();
  document.getElementById('actionCard').classList.toggle('hidden', !FILES.length);
  render();
}

function renderFileChips(){
  fileListEl.innerHTML = FILES.map((r,i) =>
    `<span class="f">📄 ${escapeHtml(r.file.name)} `
    + `<span style="color:#6b7785">(${r.rows.length-1}行)</span>`
    + `<button data-i="${i}" title="削除">✕</button></span>`).join('');
  fileListEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    FILES.splice(+b.dataset.i,1); afterParse();
  }));
}

/* ============ 列解決 ============ */
function resolveCols(headers){
  const H = headers.map(h => String(h).trim());
  const find = names => {
    for(const n of names){ const i = H.indexOf(n); if(i>=0) return i; }
    return -1;
  };
  const map = {};
  for(const key in COL) map[key] = find(COL[key]);
  return map;
}

/* ============ レコード抽出 → 代理店ごと集計 ============ */
function buildReports(){
  const records = [];
  for(let fi=0; fi<FILES.length; fi++){
    const f = FILES[fi];
    const headers = f.rows[0];
    const c = resolveCols(headers);
    if(c.agent < 0 || c.amount < 0){
      showWarn('必要な列（代理店 / 請求金額）が見つかりません: ' + f.file.name
        + '\nBusking の運行一覧 CSV をそのままご利用ください。');
      continue;
    }
    for(let i=1;i<f.rows.length;i++){
      const r = f.rows[i];
      const get = idx => idx>=0 ? String(r[idx]==null?'':r[idx]).trim() : '';
      const agent = get(c.agent);
      if(!agent) continue;
      records.push({
        uid: fi + ':' + i,           // ファイル内行位置で一意（再描画で安定）
        id: get(c.id),
        status: get(c.status),
        date: get(c.date),
        agent,
        guest: get(c.guest) || (c.guest>=0 ? '' : ''),
        time: get(c.time),
        pu: get(c.pu),
        dropoff: get(c.dropoff),
        amount: parseInt(get(c.amount).replace(/[^\d-]/g,''),10) || 0
      });
    }
  }
  return records;
}

/* ============ 描画 ============ */
function render(){
  hideWarn();
  const sheetsEl = document.getElementById('sheets');
  sheetsEl.innerHTML = '';
  document.getElementById('statusFilter').innerHTML = '';
  document.getElementById('agentFilter').innerHTML = '';
  document.getElementById('rowFilter').innerHTML = '';
  if(!FILES.length) return;

  const all = buildReports();                 // 全レコード（未フィルタ）
  if(!all.length) return;

  // ステータス集計 → 絞り込みUI（既定: キャンセルのみ除外）
  const counts = {};
  for(const r of all){ const s = r.status || '(空欄)'; counts[s] = (counts[s]||0)+1; }
  for(const s in counts){ if(!(s in statusChoice)) statusChoice[s] = !/キャン/.test(s); }
  buildStatusFilter(counts);

  // ステータス絞り込み適用
  const statusFiltered = all.filter(r => statusChoice[r.status || '(空欄)'] !== false);

  // 代理店集計 → 絞り込みUI（既定: 全社ON）
  const agCounts = {};
  for(const r of statusFiltered){ agCounts[r.agent] = (agCounts[r.agent]||0)+1; }
  for(const a in agCounts){ if(!(a in agentChoice)) agentChoice[a] = true; }
  buildAgentFilter(agCounts);

  // 代理店絞り込み適用
  const agentFiltered = statusFiltered.filter(r => agentChoice[r.agent] !== false);

  // 案件（行）絞り込みUI（既定: 全件ON）
  for(const r of agentFiltered){ if(!(r.uid in rowChoice)) rowChoice[r.uid] = true; }
  buildRowFilter(agentFiltered);

  // 案件絞り込み適用 → チェックした案件だけプレビュー表示
  const records = agentFiltered.filter(r => rowChoice[r.uid] !== false);
  if(!records.length){ document.title = '料金報告書'; return; }

  // 代理店ごとにグルーピング（出現順保持）
  const groups = new Map();
  for(const r of records){
    if(!groups.has(r.agent)) groups.set(r.agent, []);
    groups.get(r.agent).push(r);
  }

  // 各グループ内を 運行日→配車時刻→予約ID で整列
  for(const rows of groups.values()){
    rows.sort((a,b) =>
      (a.date.localeCompare(b.date)) ||
      (a.time.localeCompare(b.time)) ||
      ((parseInt(a.id,10)||0) - (parseInt(b.id,10)||0)));
  }

  const issueJp = issueDateJp();
  const sortedAgents = [...groups.keys()].sort((a,b)=>a.localeCompare(b));
  const zeroRows = [];
  for(const agent of sortedAgents){
    const rows = groups.get(agent);
    rows.forEach(r => { if(r.amount <= 0) zeroRows.push(r); });
    sheetsEl.appendChild(buildSheet(agent, rows, issueJp));
  }

  // 警告（0円のみ。除外したステータスはチップ表示で把握できる）
  if(zeroRows.length){
    showWarn('⚠️ 料金が0円の運行があります（入力もれの可能性）。Busking で金額をご確認ください。\n  対象 予約ID: '
      + zeroRows.map(r=>r.id).join(', '));
  } else hideWarn();

  // PDF 既定ファイル名（ブラウザの「PDFに保存」既定名に使われる）
  const first = sortedAgents[0] || '料金報告書';
  document.title = '料金報告書_' + sanitize(first) + '御中_' + issueCompact();
}

// 案件（予約）チェックリスト。チェックした行だけがプレビュー（=PDF）に出る。
function buildRowFilter(records){
  const el = document.getElementById('rowFilter');
  if(!records.length){ el.innerHTML = ''; return; }
  const disp = records.slice().sort((a,b) =>
    a.agent.localeCompare(b.agent) || a.date.localeCompare(b.date) ||
    a.time.localeCompare(b.time) || ((parseInt(a.id,10)||0) - (parseInt(b.id,10)||0)));
  const on = disp.filter(r => rowChoice[r.uid] !== false).length;
  el.innerHTML =
    '<div class="fld">出力する案件'
    + `<span style="color:var(--muted)">（${on}/${disp.length} 件）</span>`
    + '<button class="minibtn" data-act="all">全選択</button>'
    + '<button class="minibtn" data-act="none">全解除</button></div>'
    + '<div class="rowwrap"><table class="rowtbl">'
    + '<colgroup><col class="w-chk"><col class="w-id"><col class="w-date"><col class="w-agent">'
    + '<col class="w-guest"><col class="w-pu"><col class="w-do"><col class="w-amt"></colgroup>'
    + '<thead><tr>'
    + `<th class="c-chk"><input type="checkbox" id="rowMaster"${on===disp.length?' checked':''}></th>`
    + '<th>予約ID</th><th>運行日</th><th>代理店</th><th>団体名</th><th>P/U</th><th>D/O</th><th>金額</th>'
    + '</tr></thead><tbody>'
    + disp.map(r => {
        const ck = rowChoice[r.uid] !== false;
        return `<tr class="${ck?'':'off'}">`
          + `<td class="c-chk"><input type="checkbox" data-uid="${escapeHtml(r.uid)}"${ck?' checked':''}></td>`
          + `<td title="${escapeHtml(r.id)}">${escapeHtml(r.id)}</td>`
          + `<td title="${escapeHtml(normDate(r.date))}">${escapeHtml(normDate(r.date))}</td>`
          + `<td title="${escapeHtml(r.agent)}">${escapeHtml(r.agent)}</td>`
          + `<td title="${escapeHtml(r.guest)}">${escapeHtml(r.guest)}</td>`
          + `<td title="${escapeHtml(r.pu)}">${escapeHtml(r.pu)}</td>`
          + `<td title="${escapeHtml(r.dropoff)}">${escapeHtml(r.dropoff)}</td>`
          + `<td class="num" title="${escapeHtml(fmt(r.amount))}">${fmt(r.amount)}</td></tr>`;
      }).join('')
    + '</tbody></table></div>';

  el.querySelectorAll('input[data-uid]').forEach(cb => cb.addEventListener('change', () => {
    rowChoice[cb.dataset.uid] = cb.checked; render();
  }));
  const master = el.querySelector('#rowMaster');
  if(master) master.addEventListener('change', () => {
    disp.forEach(r => rowChoice[r.uid] = master.checked); render();
  });
  el.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const onv = b.dataset.act === 'all';
    disp.forEach(r => rowChoice[r.uid] = onv); render();
  }));
}

// 代理店絞り込みチップ（出力する代理店を ON/OFF。1社だけ・複数まとめ どちらも可）
function buildAgentFilter(counts){
  const el = document.getElementById('agentFilter');
  const keys = Object.keys(counts).sort((a,b)=>a.localeCompare(b));
  const onCount = keys.filter(a => agentChoice[a] !== false).length;
  el.innerHTML = '<div class="fld">出力する代理店'
    + `<span style="color:var(--muted)">（${onCount}/${keys.length} 社）</span>`
    + '<button class="minibtn" data-act="all">全選択</button>'
    + '<button class="minibtn" data-act="none">全解除</button></div>'
    + '<div class="statuschips">'
    + keys.map(a => {
        const checked = agentChoice[a] !== false ? ' checked' : '';
        return `<label class="chip"><input type="checkbox" data-ag="${escapeHtml(a)}"${checked}>`
             + `${escapeHtml(a)} <span class="cnt">${counts[a]}</span></label>`;
      }).join('')
    + '</div>';
  el.querySelectorAll('input[data-ag]').forEach(cb => cb.addEventListener('change', () => {
    agentChoice[cb.dataset.ag] = cb.checked; render();
  }));
  el.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const on = b.dataset.act === 'all';
    keys.forEach(a => agentChoice[a] = on);
    render();
  }));
}

// ステータス絞り込みチップ（CSVに存在する状況の値ごとに ON/OFF）
function buildStatusFilter(counts){
  const el = document.getElementById('statusFilter');
  const keys = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  el.innerHTML = '<div class="fld">PDF に含めるステータス（チェックを外すと除外）</div>'
    + '<div class="statuschips">'
    + keys.map(s => {
        const checked = statusChoice[s] !== false ? ' checked' : '';
        return `<label class="chip"><input type="checkbox" data-st="${escapeHtml(s)}"${checked}>`
             + `${escapeHtml(s)} <span class="cnt">${counts[s]}</span></label>`;
      }).join('')
    + '</div>';
  el.querySelectorAll('input[data-st]').forEach(cb => cb.addEventListener('change', () => {
    statusChoice[cb.dataset.st] = cb.checked; render();
  }));
}

function buildSheet(agent, rows, issueJp){
  const total = rows.reduce((s,r)=>s+(r.amount||0),0);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <h1 class="doc-title">ハイヤーご利用　ご料金明細書</h1>
    <div class="issue-date">${escapeHtml(issueJp)}</div>
    <div class="head">
      <div class="head-left">
        <div class="addressee"><span class="agent-name">${escapeHtml(agent)}</span>　御中</div>
        <div class="greeting">
          <p>平素より格別のご高配を賜り、誠にありがとうございます。</p>
          <p>ご予約いただきましたハイヤー料金について、下記の通りご報告申し上げます。</p>
          <p>よろしくお願いいたします</p>
        </div>
      </div>
      <div class="head-right">
        <div class="company-name">${escapeHtml(COMPANY.name)}</div>
        <div class="company-info">${COMPANY.lines.map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>
      </div>
    </div>
    <div class="total-box">
      <div class="total-label">ご請求金額（税込）</div>
      <div class="total-yen">¥</div>
      <div class="total-amount">${fmt(total)}</div>
    </div>
    <table class="detail-table">
      <thead><tr>
        <th class="c-id">ID</th><th class="c-date">Date</th><th class="c-guest">Guest</th>
        <th class="c-pu">P/U</th><th class="c-do">D/O</th><th class="c-amount">Amount(JPY)</th>

function rowHtml(r){
  const cls = /キャン/.test(r.status) ? ' class="cancel"' : (r.amount<=0 ? ' class="zero"' : '');
  return `<tr${cls}>
    <td class="c-id">${escapeHtml(r.id)}</td>
    <td class="c-date">${escapeHtml(normDate(r.date))}</td>
    <td class="c-guest" title="${escapeHtml(r.guest)}">${escapeHtml(r.guest)}</td>
    <td class="c-pu" title="${escapeHtml(r.pu)}">${escapeHtml(r.pu)}</td>
    <td class="c-do" title="${escapeHtml(r.dropoff)}">${escapeHtml(r.dropoff)}</td>
    <td class="c-amount">${fmt(r.amount)}</td>
  </tr>`;
}

/* ============ ワンクリックPDFダウンロード（代理店ごとに1ファイル） ============ */
async function downloadPdfs(){
  const sheets = Array.from(document.querySelectorAll('#sheets .sheet'));
  if(!sheets.length){ alert('出力する案件がありません。案件にチェックを入れてください。'); return; }
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    alert('PDF生成ライブラリの読み込みに失敗しました。通信環境をご確認のうえ再読み込みしてください。');
    return;
  }
  const { jsPDF } = window.jspdf;
  const btn = document.getElementById('dlBtn');
  const hint = document.getElementById('dlHint');
  btn.disabled = true;
  const compact = issueCompact();

  try{
    for(let i=0;i<sheets.length;i++){
      const sheet = sheets[i];
      const agent = (sheet.querySelector('.agent-name')?.textContent || '料金報告書').trim();
      hint.textContent = `生成中… (${i+1}/${sheets.length}) ${agent}`;

      // 画面表示の見た目どおりに高解像度でキャプチャ（JPEGで軽量化）
      const canvas = await html2canvas(sheet, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
      const img = canvas.toDataURL('image/jpeg', 0.92);

      // A4 横に内接させて配置
      const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
      const pageW = pdf.internal.pageSize.getWidth();   // 297
      const pageH = pdf.internal.pageSize.getHeight();  // 210
      const margin = 8;
      let w = pageW - margin*2;
      let h = canvas.height * w / canvas.width;
      if(h > pageH - margin*2){ h = pageH - margin*2; w = canvas.width * h / canvas.height; }
      pdf.addImage(img, 'JPEG', (pageW - w)/2, margin, w, h);

      pdf.save('料金報告書_' + sanitize(agent) + '御中' + (compact ? '_' + compact : '') + '.pdf');
      await new Promise(r => setTimeout(r, 300)); // 連続DLの取りこぼし防止
    }
    hint.textContent = `${sheets.length}件のPDFをダウンロードしました。`;
  }catch(e){
    hint.textContent = '生成に失敗しました: ' + (e && e.message ? e.message : e);
  }finally{
    btn.disabled = false;
  }
}

/* ============ ユーティリティ ============ */
function pad(n){ return String(n).padStart(2,'0'); }
function fmt(n){ return (Number(n)||0).toLocaleString('en-US'); }
function normDate(raw){
  if(!raw) return '';
  const m = String(raw).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? `${m[1]}/${+m[2]}/${+m[3]}` : raw;
}
function issueDateJp(){
  const v = document.getElementById('issueDate').value;
  const m = v.match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : '';
}
function issueCompact(){
  const v = document.getElementById('issueDate').value;
  return v ? v.replace(/-/g,'') : '';
}
function sanitize(s){
  return String(s).replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim();
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showWarn(msg){ const e=document.getElementById('warn'); e.textContent=msg; e.classList.remove('hidden'); }
function hideWarn(){ const e=document.getElementById('warn'); e.textContent=''; e.classList.add('hidden'); }
